  - slug: griffiths-2026-comparing-electrical
    title: Comparing electrical and ultrasound transcutaneous auricular vagus nerve stimulation on associative memory
    authors:
    - Griffiths, Benjamin J.
    - He, Ziqi
    - Ciftepinar, Irem
    - Choi, Hyuk
    - Song, Jae-Jun
    - Kaiser, Marcus
    - Jung, JeYoung
    journal: 'Neuromodulation: Technology at the Neural Interface'
    date: 2026-07
    doi: 10.1016/j.neurom.2026.07.001
    journal_url: https://linkinghub.elsevier.com/retrieve/pii/S1094715926006604
    verify: true
    abstract: >
      Associative memory, the ability to bind and retrieve relationships between unrelated elements, is a cornerstone of human cognition and a primary target for neurorehabilitation. Vagus nerve stimulation (VNS) has emerged as a promising method to modulate the locus coeruleus-norepinephrine system and hippocampal-prefrontal circuits essential for memory. However, the comparative efficacy of noninvasive modalities such as electrical transcutaneous VNS (E-taVNS) and the emerging field of ultrasound (U-taVNS) remains poorly understood in the context of active recall. In this study, participants performed a cross-modal video–word associative memory task before and after receiving either E-taVNS or U-taVNS in active and sham conditions. We investigated whether these modalities enhance cued recall accuracy and retrieval reaction time. Our results revealed that neither E-taVNS nor U-taVNS significantly improved recall accuracy. However, E-taVNS significantly accelerated response times specifically for correctly recalled items. These findings suggest that although taVNS may not increase the likelihood of recalling associative memories after a brief retention interval, electrical stimulation may enhance the efficiency with which we do so. These findings suggest that E-taVNS is a viable tool for facilitating memory processes, although further research is required to optimize ultrasound parameters and validate mechanistic pathways through physiologic monitoring.

  - slug: lifanov-carr-2024-reconstructing-spatiotemporal
    title: Reconstructing spatiotemporal trajectories of visual object memories in the human brain
    authors:
    - Lifanov-Carr, Julia
    - Griffiths, Benjamin J.
    - Linde-Domingo, Juan
    - Ferreira, Catarina S.
    - Wilson, Martin
    - Mayhew, Stephen D.
    - Charest, Ian
    - Wimber, Maria
    journal: eNeuro
    volume: '11'
    issue: '9'
    article_number: ENEURO.0091-24.2024
    date: 2024-09
    doi: 10.1523/eneuro.0091-24.2024
    journal_url: https://www.eneuro.org/lookup/doi/10.1523/ENEURO.0091-24.2024
    verify: true
    abstract: >
      How the human brain reconstructs, step-by-step, the core elements of past experiences is still unclear. Here, we map the spatiotemporal trajectories along which visual object memories are reconstructed during associative recall. Specifically, we inquire whether retrieval reinstates feature representations in a copy-like but reversed direction with respect to the initial perceptual experience, or alternatively, this reconstruction involves format transformations and regions beyond initial perception. Participants from two cohorts studied new associations between verbs and randomly paired object images, and subsequently recalled the objects when presented with the corresponding verb cue. We first analyze multivariate fMRI patterns to map where in the brain high- and low-level object features can be decoded during perception and retrieval, showing that retrieval is dominated by conceptual features, represented in comparatively late visual and parietal areas. A separately acquired EEG dataset is then used to track the temporal evolution of the reactivated patterns using similarity-based EEG–fMRI fusion. This fusion suggests that memory reconstruction proceeds from anterior frontotemporal to posterior occipital and parietal regions, in line with a conceptual-to-perceptual gradient but only partly following the same trajectories as during perception. Specifically, a linear regression statistically confirms that the sequential activation of ventral visual stream regions is reversed between image perception and retrieval. The fusion analysis also suggests an information relay to frontoparietal areas late during retrieval. Together, the results shed light onto the temporal dynamics of memory recall and the transformations that the information undergoes between the initial experience and its later reconstruction from memory.

  - slug: michelmann-2018-data-driven
    title: Data-driven re-referencing of intracranial EEG based on independent component analysis (ICA)
    authors:
    - Michelmann, Sebastian
    - Treder, Matthias S.
    - Griffiths, Benjamin
    - Kerrén, Casper
    - Roux, Frédéric
    - Wimber, Maria
    - Rollings, David
    - Sawlani, Vijay
    - Chelvarajah, Ramesh
    - Gollwitzer, Stephanie
    - Kreiselmeyer, Gernot
    - Hamer, Hajo
    - Bowman, Howard
    - Staresina, Bernhard
    - Hanslmayr, Simon
    journal: Journal of Neuroscience Methods
    volume: '307'
    first_page: '125'
    last_page: '137'
    date: 2018-09
    doi: 10.1016/j.jneumeth.2018.06.021
    journal_url: https://linkinghub.elsevier.com/retrieve/pii/S0165027018301997
    verify: true
    abstract: >
      Intracranial recordings from patients implanted with depth electrodes are a valuable source of information in neuroscience. They allow for the unique opportunity to record brain activity with high spatial and temporal resolution. A common pre-processing choice in stereotactic EEG (S-EEG) is to re-reference the data with a bipolar montage. In this, each channel is subtracted from its neighbor, to reduce commonalities between channels and isolate activity that is spatially confined. We challenge the assumption that bipolar reference effectively performs this task. To extract local activity, the distribution of the signal source of interest, interfering distant signals, and noise need to be considered. Referencing schemes with fixed coefficients can decrease the signal to noise ratio (SNR) of the data, they can lead to mislocalization of activity and consequently to misinterpretation of results. We propose to use Independent Component Analysis (ICA), to derive filter coefficients that reflect the statistical dependencies of the data at hand. We describe and demonstrate this on human S-EEG recordings. In a simulation with real data, we quantitatively show that ICA outperforms the bipolar referencing operation in sensitivity and importantly in specificity when revealing local time series from the superposition of neighboring channels. We argue that ICA already performs the same task that bipolar referencing pursues, namely undoing the linear superposition of activity and will identify activity that is local. When investigating local sources in human S-EEG, ICA should be preferred over re-referencing the data with a bipolar montage.

  - slug: duecker-2025-guided-visual
    title: Guided visual search is associated with target boosting and distractor suppression in early visual cortex
    authors:
    - Duecker, Katharina
    - Shapiro, Kimron L.
    - Hanslmayr, Simon
    - Griffiths, Benjamin J.
    - Pan, Yali
    - Wolfe, Jeremy M.
    - Jensen, Ole
    journal: Communications Biology
    volume: '8'
    issue: '1'
    article_number: '912'
    date: '2025-06-11'
    doi: 10.1038/s42003-025-08321-3
    journal_url: https://www.nature.com/articles/s42003-025-08321-3
    verify: true
    abstract: >
      Visual attention paradigms have revealed that neural excitability in higher-order visual areas is modulated according to a priority map guiding attention towards task-relevant locations. Neural activity in early visual regions, however, has been argued to be modulated based on bottom-up salience. Here, we combined Magnetoencephalography (MEG) and Rapid Invisible Frequency Tagging (RIFT) in a classic visual search paradigm to study feature-guidance in early human visual cortex. Our results demonstrate evidence for both target boosting and distractor suppression when the participants were informed about the task-relevant and -irrelevant colour (guided search) compared to when they were not (unguided search). These results conceptually replicated using both a magnitude-squared coherence approach and a General Linear Model based on a single-trial measure of the RIFT response. The present findings reveal that feature-guidance in visual search affects neuronal excitability as early as primary visual cortex, possibly contributing to a priority-map-based mechanism.

  - slug: schreiner-2024-spindle-ripples
    title: Spindle-locked ripples mediate memory reactivation during human NREM sleep
    authors: ["Schreiner, Thomas", "Griffiths, Benjamin J.", "Kutlu, Merve", "Vollmar, Christian", "Kaufmann, Elisabeth", "Quach, Stefanie", "Remi, Jan", "Noachtar, Soheyl", "Staudigl, Tobias"]
    journal: Nature Communications
    volume: "15"
    article_number: "5249"
    date: 2024-06          # day not confirmed
    doi: 10.1038/s41467-024-49572-8
    journal_url: https://www.nature.com/articles/s41467-024-49572-8
    preprint_url: https://www.biorxiv.org/content/10.1101/2023.01.27.525854
    verify: true
    abstract: >
      Memory consolidation relies in part on the reactivation of previous experiences during sleep. The precise interplay of sleep-related oscillations (slow oscillations, spindles and ripples) is thought to coordinate the information flow between relevant brain areas, with ripples mediating memory reactivation. However, in humans empirical evidence for a role of ripples in memory reactivation is lacking. Here, we investigated the relevance of sleep oscillations and specifically ripples for memory reactivation during human sleep using targeted memory reactivation. Intracranial electrophysiology in epilepsy patients and scalp EEG in healthy participants revealed that elevated levels of slow oscillation - spindle activity coincided with the read-out of experimentally induced memory reactivation. Importantly, spindle-locked ripples recorded intracranially from the medial temporal lobe were found to be correlated with the identification of memory reactivation during non-rapid eye movement sleep. Our findings establish ripples as key-oscillation for sleep-related memory reactivation in humans and emphasize the importance of the coordinated interplay of the cardinal sleep oscillations.

  - slug: kerren-2022-phase-separation
    title: Phase separation of competing memories along the human hippocampal theta rhythm
    authors: ["Kerrén, Casper", "van Bree, Sander", "Griffiths, Benjamin J.", "Wimber, Maria"]
    journal: eLife
    volume: "11"
    article_number: e80633
    date: 2022-11-17
    doi: 10.7554/eLife.80633
    journal_url: https://elifesciences.org/articles/80633
    abstract: >
      Competition between overlapping memories is considered one of the major causes of forgetting, and it is still unknown how the human brain resolves such mnemonic conflict. In the present magnetoencephalography (MEG) study, we empirically tested a computational model that leverages an oscillating inhibition algorithm to minimise overlap between memories. We used a proactive interference task, where a reminder word could be associated with either a single image (non-competitive condition) or two competing images, and participants were asked to always recall the most recently learned word–image association. Time-resolved pattern classifiers were trained to detect the reactivated content of target and competitor memories from MEG sensor patterns, and the timing of these neural reactivations was analysed relative to the phase of the dominant hippocampal 3 Hz theta oscillation. In line with our pre-registered hypotheses, target and competitor reactivations locked to different phases of the hippocampal theta rhythm after several repeated recalls. Participants who behaviourally experienced lower levels of interference also showed larger phase separation between the two overlapping memories. The findings provide evidence that the temporal segregation of memories, orchestrated by slow oscillations, plays a functional role in resolving mnemonic competition by separating and prioritising relevant memories under conditions of high interference.

  - slug: griffiths-2023-eye-tracking-ieeg
    title: Why and how should I track eye-movements during iEEG recordings?
    authors: ["Griffiths, Benjamin J.", "Staudigl, Tobias"]
    journal: "Intracranial EEG: A Guide for Cognitive Neuroscientists (Springer)"
    first_page: "217"
    last_page: "237"
    date: 2023
    doi: 10.1007/978-3-031-20910-9_14     # from a citation index, not Springer itself
    journal_url: https://doi.org/10.1007/978-3-031-20910-9_14
    preprint_url: https://doi.org/10.31234/osf.io/7pyk9
    verify: true
    abstract: >
      We are visual animals. How we perceive, understand and interact with the world is intimately tied to our visual sense. Yet, the value of monitoring ocular activity in neuroscientific experiments is often overlooked. In this chapter, we set out to highlight how a whole host of ocular phenomena relate to brain function and human cognition, with a special focus on intracranial electroencephalogram (iEEG) recordings. We begin by describing key ocular events, such as saccades and fixations, before discussing the extensive impact these ocular events have on common neural phenomenon and measurable behaviour. Lastly, we provide practical recommendations for combining eye tracking and intracranial EEG in neuroscientific research.

  - slug: michelmann-2022-alpha-beta-chapter
    title: The role of alpha and beta oscillations in the human EEG during perception and memory processes
    authors: ["Michelmann, Sebastian", "Griffiths, Benjamin", "Hanslmayr, Simon"]
    journal: The Oxford Handbook of EEG Frequency (Oxford University Press)
    first_page: "202"
    last_page: "219"
    date: 2022
    doi: 10.1093/oxfordhb/9780192898340.013.10
    journal_url: https://doi.org/10.1093/oxfordhb/9780192898340.013.10
    verify: true
    abstract: >
      Traditionally alpha and beta oscillations have been viewed a passive phenomenon, being active only when our minds are idling. Empirical evidence over the last two decades challenged this classic view and suggests that alpha/beta play a much more active role during cognitive processes. In the human brain alpha oscillations influence processing of large neural ensembles by regulating the strength of synchronization within these ensembles and by providing discrete time windows for firing. With EEG recordings we can observe these two mechanisms via modulations of the signal strength (i.e. power) and modulations of phase, respectively. In this chapter we focus on these two signal properties of alpha/beta oscillations and review studies that investigated the relevance of alpha power and phase modulations in tasks involving perception and memory processes. These studies reveal a reduction in alpha/beta power when a stimulus is being perceived or mentally replayed. Furthermore, alpha phase reflects rhythmical sampling of stimulus information during perception, and the replay of that information during retrieval. Based on these findings, we argue that alpha oscillations play an active role in representing information-rich content in the brain. Importantly, alpha/beta oscillations perform this function regardless of whether the information is being presented externally, as is the case in perception, or whether it is being generated internally, as is the case in memory retrieval.

  - slug: cesnaite-2025-eegmanypipelines
    title: "The EEGManyPipelines dataset: Metascientific data on 168 independent analyses of a single EEG dataset"
    authors: ["Cesnaite, Elena", "Vitale, Andrea", "Pascarella, Annalisa", "EEGManyPipelines Consortium"]
    journal: MetaArXiv
    preprint: true
    date: 2025-12-03
    doi: 10.31222/osf.io/c4xwg_v1
    journal_url: https://doi.org/10.31222/osf.io/c4xwg_v1
    verify: true
    abstract: >
      There is a growing need for large-scale, global studies in response to the replication crisis, which has raised concerns across many scientific fields and prompted efforts to understand the sources of variability in research outcomes. Here we describe the EEGManyPipelines dataset: a many-analyst study aiming to examine how differences in electrophysiology (EEG) data analysis may contribute to differences in the results. We describe data shared and analyzed by 168 analyst teams. The original shared raw data consisted of behavioral data and EEG recordings of 33 participants performing a long-term memory task, together with 8 hypotheses regarding event-related potentials and time-frequency effects. Analyst teams also provided meta-scientific data detailing analysts' approach to hypotheses: processed EEG data, scripts, and answers to questionnaires. We propose this unique dataset for future use to study analytical flexibility, research culture, and scientific decision-making. It offers a valuable tool for meta-scientific, global and multicenter studies, EEG methodology, and reproducibility studies.
