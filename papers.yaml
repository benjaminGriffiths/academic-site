  bio: >
    I'm a cognitive neuroscientist studying how the human brain forms and
    retrieves long-term memories: what neural oscillations contribute to
    memory, and how far the neural hubs of memory and navigation overlap.
    I combine intracranial EEG, MEG and fMRI with forward encoding models,
    classifiers and non-invasive brain stimulation, and I'm interested in how
    these insights could help people living with dementia, or learners in
    the classroom.

