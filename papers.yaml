  - slug: griffiths-2026-alpha-awareness
    title: Alpha oscillations track the projection of reactivated memories into conscious awareness
    authors: ["Griffiths, Benjamin J."]
    journal: Journal of Neuroscience
    volume: "46"
    article_number: e1487252026
    date: 2026-03-04
    doi: 10.1523/JNEUROSCI.1487-25.2026
    journal_url: https://www.jneurosci.org/content/early/2026/03/03/JNEUROSCI.1487-25.2026.abstract
    preprint_url: https://doi.org/10.64898/2026.02.13.705747
    drive_id: 18pSOJHEPh7TCijvDcJosWBDEPqHvSgEF
    abstract: >
      By definition, episodic memory is a conscious phenomenon. Memory traces reactivated by the hippocampus and reinstated in the sensory cortices need to enter conscious awareness for them to be re-experienced and overtly recalled. However, it remains unclear whether such reactivation in-and-of-itself ensures that memories will be overtly recalled. To investigate this, magnetoencephalography (MEG) recordings were analysed from thirty-one participants (18 female, 13 male) completing a video-word pair associates memory task. When combining linear classifiers and spectral analyses, sensory cortical reactivation could be observed without overt recall occurring, suggesting reactivation does not guarantee overt recall. Instead, overt recall was additively predicted by (i) an increase in reactivated representations rhythmically fluctuating within the alpha band, and (ii) a decrease in total sensory neocortical alpha power. These results are consistent with accounts which propose that reactivation benefits from desynchronising the network to provide representational space for stimulus-specific information, and/or amplifying stimulus-specific information above residual noise. Altogether, these results suggest that representational reactivation can occur without overt recall, and suggest a role for alpha oscillations in projecting internally-generated representations into conscious awareness.

  - slug: griffiths-2026-rhythmic-light
    title: Rhythmic stimulation elicits multiple, concurrent neural responses
    authors: ["Griffiths, Benjamin J.", "Duecker, Katharina", "Fakche, Camille", "Dugué, Laura", "Quinn, Andrew", "Jensen, Ole"]
    journal: Cerebral Cortex
    volume: "36"
    issue: "9"
    article_number: bhag152
    date: 2026-09-22
    doi: 10.1093/cercor/bhag152
    journal_url: https://academic.oup.com/cercor/article/36/9/bhag152/8828956
    preprint_url: https://doi.org/10.1101/2025.11.05.686709
    abstract: >
      Rhythmic light stimulation offers solutions to innumerable cognitive and neurological disorders. However, like any neuromodulatory technique, responses to rhythmic light stimulation are highly variable, producing challenges in replicating lab-based studies and translating findings to the clinic. Across 3 magnetoencephalography (MEG) and electroencephalography (EEG) experiments, we show that this variability can, in part, be attributed to rhythmic light stimulation eliciting multiple, coexisting neural responses which have separable influences on behavior. Specifically, we find that rhythmic light stimulation produces neural responses at both the fundamental (f ) and second harmonic (2f ) frequencies, and that these responses are differentially shaped by endogenous oscillatory dynamics that vary across participants. Importantly, these harmonic responses separably contribute to perception, with gamma-band responses supporting the representation of stimulus-specific information, and alpha-band responses causally contributing to near-threshold visual perception. We reproduce these effects across datasets, paradigms, and oscillatory bands, suggesting that the multiple, concurrent oscillatory responses elicited by rhythmic light stimulation are a robust and pervasive phenomenon. We propose that the complexity of neural responses to rhythmic stimulation can explain why there is substantial variability between studies using these techniques, and that understanding these complex responses may help advance neuromodulatory technologies for both fundamental and clinical neuroscience.

  - slug: kerren-2025-dimensionality
    title: Exploring the role of dimensionality transformation in episodic memory
    authors: ["Kerrén, Casper", "Reznik, Daniel", "Doeller, Christian F.", "Griffiths, Benjamin J."]
    journal: Trends in Cognitive Sciences
    date: 2025
    doi: ""          # TODO: add DOI (Crossref lookup failed)
    journal_url: https://www.cell.com/trends/cognitive-sciences/fulltext/S1364-6613(25)00021-X
    drive_id: 1qbDvEXfwnby9VavUnlEjk50j8X7Gh-z9
    verify: true
    abstract: >
      Episodic memory must accomplish two adversarial goals: encoding and storing a multitude of experiences without exceeding the finite neuronal structure of the brain, and recalling memories in vivid detail. Dimensionality reduction and expansion (‘dimensionality transformation’) enable the brain to meet these demands. Reduction compresses sensory input into simplified, storable codes, while expansion reconstructs vivid details. Although these processes are essential to memory, their neural mechanisms for episodic memory remain unclear. Drawing on recent insights from cognitive psychology, systems neuroscience, and neuroanatomy, we propose two accounts of how dimensionality transformation occurs in the brain: structurally (via corticohippocampal pathways) and functionally (through neural oscillations). By examining cross-species evidence, we highlight neural mechanisms that may support episodic memory and identify crucial questions for future research.

  - slug: griffiths-2024-head-direction
    title: Electrophysiological signatures of veridical head direction in humans
    authors: ["Griffiths, Benjamin J.", "Schreiner, T.", "Schaefer, J.", "Vollmar, C.", "Kaufmann, E.", "Quach, S.", "Remi, J.", "Noachtar, S.", "Staudigl, Tobias"]
    journal: Nature Human Behaviour
    date: 2024-05-07
    doi: 10.1038/s41562-024-01872-1
    journal_url: https://www.nature.com/articles/s41562-024-01872-1
    preprint_url: https://www.biorxiv.org/content/10.1101/2023.01.26.525724v2
    drive_id: 1Ftemfs60aLRm9Q-bmwts-A50o2DCJg2J
    verify: true     # add volume/pages; co-author given names
    abstract: >
      Information about heading direction is critical for navigation as it provides the means to orient ourselves in space. However, given that veridical head-direction signals require physical rotation of the head and most human neuroimaging experiments depend upon fixing the head in position, little is known about how the human brain is tuned to such heading signals. Here we address this by asking 52 healthy participants undergoing simultaneous electroencephalography and motion tracking recordings (split into two experiments) and 10 patients undergoing simultaneous intracranial electroencephalography and motion tracking recordings to complete a series of orientation tasks in which they made physical head rotations to target positions. We then used a series of forward encoding models and linear mixed-effects models to isolate electrophysiological activity that was specifically tuned to heading direction. We identified a robust posterior central signature that predicts changes in veridical head orientation after regressing out confounds including sensory input and muscular activity. Both source localization and intracranial analysis implicated the medial temporal lobe as the origin of this effect. Subsequent analyses disentangled head-direction signatures from signals relating to head rotation and those reflecting location-specific effects. Lastly, when directly comparing head direction and eye-gaze-related tuning, we found that the brain maintains both codes while actively navigating, with stronger tuning to head direction in the medial temporal lobe. Together, these results reveal a taxonomy of population-level head-direction signals within the human brain that is reminiscent of those reported in the single units of rodents.

  - slug: kerren-2024-prototype-confidence
    title: A reduction in self-reported confidence accompanies the recall of memories distorted by prototypes
    authors: ["Kerrén, Casper", "Zhao, Y.", "Griffiths, Benjamin J."]
    journal: Communications Psychology
    volume: "2"
    article_number: "58"
    date: 2024-07-01
    doi: 10.1038/s44271-024-00108-2
    journal_url: https://www.nature.com/articles/s44271-024-00108-2
    preprint_url: https://osf.io/preprints/psyarxiv/gznfh
    drive_id: 1R_aA6qbdixXvYAyxC0FtSmv71O2MiueY
    verify: true
    abstract: >
      When we recall a past event, we reconstruct the event based on a combination of episodic details and semantic knowledge (e.g., prototypes). Though prototypes can impair the veracity of recall, it remains unclear whether we are metacognitively aware of the distortions they introduce. To address this, we conducted six experiments in which participants learned object-colour/object-location pairs and subsequently recalled the colour/location when cued with the object. Leveraging unsupervised machine learning algorithms, we extracted participant-specific prototypes and embedded responses in two-dimensional space to quantify prototype-based distortions in individual memory traces. Our findings reveal robust and conceptually replicable evidence to suggest that prototype-based distortion is accompanied by a reduction in self-reported confidence - an implicit measure of metacognitive awareness. Critically, we find evidence to suggest that it is prototype-based distortion of a memory trace that undermines confidence, rather than a lack of confidence biasing reconstruction towards the use of prototypes. Collectively, these findings suggest that we possess metacognitive awareness of distortions embedded in our memories.

  - slug: griffiths-2023-gamma-memory
    title: Gamma oscillations and episodic memory
    authors: ["Griffiths, Benjamin J.", "Jensen, Ole"]
    journal: Trends in Neurosciences
    volume: "46"
    issue: "10"
    first_page: "832"
    last_page: "846"
    date: 2023
    doi: ""          # TODO: add DOI (Crossref lookup failed)
    journal_url: https://www.cell.com/trends/neurosciences/fulltext/S0166-2236(23)00163-7
    drive_id: 1Q5a4yfWcw8uIbNFrc6nQjiMi1-nEI1u5
    verify: true
    abstract: >
      Enhanced gamma oscillatory activity (30–80 Hz) accompanies the successful formation and retrieval of episodic memories. While this co-occurrence is well documented, the mechanistic contributions of gamma oscillatory activity to episodic memory remain unclear. Here, we review how gamma oscillatory activity may facilitate spike timing-dependent plasticity, neural communication, and sequence encoding/retrieval, thereby ensuring the successful formation and/or retrieval of an episodic memory. Based on the evidence reviewed, we propose that multiple, distinct forms of gamma oscillation can be found within the canonical gamma band, each of which has a complementary role in the neural processes listed above. Further exploration of these theories using causal manipulations may be key to elucidating the relevance of gamma oscillatory activity to episodic memory.

  - slug: griffiths-2023-gamma-stimulation
    title: Imperceptible gamma-band sensory stimulation enhances episodic memory retrieval
    authors: ["Griffiths, Benjamin J.", "Weinert, D.", "Jensen, Ole", "Staudigl, Tobias"]
    journal: bioRxiv
    preprint: true
    date: 2023-07-21
    doi: 10.1101/2023.07.21.550057
    journal_url: https://www.biorxiv.org/content/10.1101/2023.07.21.550057v1
    drive_id: 1-3us8v_Ts8F6F5Ik27PT3tC8Ib9WhSsQ
    verify: true
    abstract: >
      Enhanced gamma activity (30-100Hz) coincides with the successful recall of episodic memories, but it remains unknown whether this oscillatory activity is a cause or a consequence of the retrieval process. To address this question, we asked human participants to complete a paired associates memory task while undergoing sensory stimulation (at 65Hz, 43.3Hz and 32.5Hz). We observed that 65Hz and 32.5Hz sensory stimulation enhances recall compared to a baseline condition without stimulation. No similar effect was observed following 43.3Hz stimulation. Notably, while almost all participants could perceive 32.5Hz and 43.3Hz sensory stimulation, only a small proportion of participants (∼10%) could perceive the 65Hz visual flicker, suggesting 65Hz sensory stimulation acts as an imperceptible intervention to enhance recall. To understand the dual action of 65Hz and 32.5Hz sensory stimulation on recall, we built three pyramidal-interneuronal network gamma (PING) models and drove them using the same stimulation protocols as in the behavioural task. The behavioural results could be reproduced by stimulating an endogenous ∼32Hz oscillation, but not by stimulating an endogenous ∼65Hz oscillation nor by stimulating a network without an endogenous oscillation. These results suggest that imperceptible 65Hz sensory stimulation enhances recall by harmonically entraining an endogenous ∼32.5Hz oscillation. Based on these findings, we propose that “slow” gamma oscillations play a causal role in episodic memory retrieval.

  - slug: griffiths-2022-thalamus
    title: Rhythmic interactions between the mediodorsal thalamus and prefrontal cortex precede human visual perception
    authors: ["Griffiths, Benjamin J.", "Zaehle, Tino", "Repplinger, Stefan", "Schmitt, Friedhelm C.", "Voges, Jürgen", "Hanslmayr, Simon", "Staudigl, Tobias"]
    journal: Nature Communications
    volume: "13"
    article_number: "3736"
    date: 2022-06-29
    doi: 10.1038/s41467-022-31407-z
    journal_url: https://www.nature.com/articles/s41467-022-31407-z
    preprint_url: https://doi.org/10.1101/2022.02.07.479362
    drive_id: 1uEOx98IqFItKeIWO8ZKYsDPc6fxJ6NCK
    abstract: >
      The thalamus is much more than a simple sensory relay. High-order thalamic nuclei, such as the mediodorsal thalamus, exert a profound influence over animal cognition. However, given the difficulty of directly recording from the thalamus in humans, next-to-nothing is known about thalamic and thalamocortical contributions to human cognition. To address this, we analysed simultaneously-recorded thalamic iEEG and whole-head MEG in six patients (four female, two male; plus MEG recordings from twelve healthy controls) as they completed a visual detection task. We observed that the phase of both ongoing mediodorsal thalamic and prefrontal low-frequency activity was predictive of perceptual performance. Critically however, mediodorsal thalamic activity mediated prefrontal contributions to perceptual performance. These results suggest that it is thalamocortical interactions, rather than cortical activity alone, that is predictive of upcoming perceptual performance and, more generally, highlights the importance of accounting for the thalamus when theorising about cortical contributions to human cognition.

  - slug: griffiths-2021-disentangling
    title: Disentangling neocortical alpha/beta and hippocampal theta/gamma oscillations in human episodic memory formation
    authors: ["Griffiths, Benjamin J.", "Martín-Buro, María Carmen", "Staresina, Bernhard P.", "Hanslmayr, Simon"]
    journal: NeuroImage
    volume: "242"
    article_number: "118454"
    date: 2021-11
    doi: 10.1016/j.neuroimage.2021.118454
    journal_url: https://www.sciencedirect.com/science/article/pii/S105381192100728X
    preprint_url: https://doi.org/10.1101/2020.01.22.915330
    abstract: >
      To form an episodic memory, we must first process a vast amount of sensory information about the to-be-encoded event and then bind these sensory representations together to form a coherent memory trace. While these two cognitive capabilities are thought to have two distinct neural origins, with neocortical alpha/beta oscillations supporting information representation and hippocampal theta-gamma phase-amplitude coupling supporting mnemonic binding, evidence for a dissociation between these two neural markers is conspicuously absent. To address this, seventeen human participants completed an associative memory task that first involved processing information about three sequentially-presented stimuli, and then binding these stimuli together into a coherent memory trace, all the while undergoing MEG recordings. We found that decreases in neocortical alpha/beta power during sequence perception, but not mnemonic binding, correlated with enhanced memory performance. Hippocampal theta/gamma phase-amplitude coupling, however, showed the opposite pattern; increases during mnemonic binding (but not sequence perception) correlated with enhanced memory performance. These results demonstrate that memory-related decreases in neocortical alpha/beta power and memory-related increases in hippocampal theta/gamma phase-amplitude coupling arise at distinct stages of the memory formation process. We speculate that this temporal dissociation reflects a functional dissociation in which neocortical alpha/beta oscillations could support the processing of incoming information relevant to the memory, while hippocampal theta-gamma phase-amplitude coupling could support the binding of this information into a coherent memory trace.

  - slug: griffiths-2021-encoding-retrieval
    title: Alpha/beta power decreases during episodic memory formation predict the magnitude of alpha/beta power decreases during subsequent retrieval
    authors: ["Griffiths, Benjamin J.", "Martín-Buro, María Carmen", "Staresina, Bernhard P.", "Hanslmayr, Simon", "Staudigl, Tobias"]
    journal: Neuropsychologia
    volume: "153"
    article_number: "107755"
    date: 2021-03
    doi: 10.1016/j.neuropsychologia.2021.107755
    journal_url: https://www.sciencedirect.com/science/article/abs/pii/S0028393221000063
    preprint_url: https://doi.org/10.1101/2020.07.08.193763
    abstract: >
      Episodic memory retrieval is characterised by the vivid reinstatement of information about a personally-experienced event. Growing evidence suggests that this reinstatement is supported by reductions in the spectral power of alpha/beta activity. Given that the amount of information that can be recalled depends on the amount of information that was originally encoded, information-based accounts of alpha/beta activity would suggest that retrieval-related alpha/beta power decreases similarly depend upon decreases in alpha/beta power during encoding. To test this hypothesis, seventeen human participants completed a sequence-learning task while undergoing concurrent MEG recordings. Regression-based analyses were then used to estimate how alpha/beta power decreases during encoding predicted alpha/beta power decreases during retrieval on a trial-by-trial basis. When subjecting these parameter estimates to group-level analysis, we find evidence to suggest that retrieval-related alpha/beta (7-15Hz) power decreases fluctuate as a function of encoding-related alpha/beta power decreases. These results suggest that retrieval-related alpha/beta power decreases are contingent on the decrease in alpha/beta power that arose during encoding. Subsequent analysis uncovered no evidence to suggest that these alpha/beta power decreases reflect stimulus identity, indicating that the contingency between encoding- and retrieval-related alpha/beta power reflects the reinstatement of a neurophysiological operation, rather than neural representation, during episodic memory retrieval.

  - slug: griffiths-2020-event-conjunction
    title: "Event conjunction: How the hippocampus integrates episodic memories across event boundaries"
    authors: ["Griffiths, Benjamin J.", "Fuentemilla, Lluís"]
    journal: Hippocampus
    volume: "30"
    issue: "2"
    first_page: "162"
    last_page: "171"
    date: 2020-02            # issue date (online 2019-09-30)
    doi: 10.1002/hipo.23161
    journal_url: https://onlinelibrary.wiley.com/doi/abs/10.1002/hipo.23161
    preprint_url: https://doi.org/10.31234/osf.io/v47n2
    abstract: >
      Our lives are a continuous stream of experience. Our episodic memories on the other hand have a definitive beginning, middle, and end. Theories of event segmentation suggest that salient changes in our environment produce event boundaries which partition the past from the present and, as a result, produce discretised memories. However, event boundaries cannot completely discretise two memories; any shared conceptual link will lead to the rapid integration of these memories. Here, we present a new framework inspired by electrophysiological research that resolves this apparent contradiction. At its heart, the framework proposes that hippocampal theta‐gamma coupling maintains a highly abstract model of an ongoing event and serves to encode this model as an episodic memory. When a second but related event begins, this theta‐gamma model is rapidly reconstructed within the hippocampus where new details of the second event can be appended to the existing event model. The event conjunction framework is the first electrophysiological explanation of how event memories can be formed at, and integrated across, event boundaries.

  - slug: griffiths-2019-alpha-fidelity
    title: Alpha/beta power decreases track the fidelity of stimulus-specific information
    authors: ["Griffiths, Benjamin J.", "Mayhew, Stephen D.", "Mullinger, Karen J.", "Jorge, João", "Charest, Ian", "Wimber, Maria", "Hanslmayr, Simon"]
    journal: eLife
    volume: "8"
    article_number: e49562
    date: 2019-11-29
    doi: 10.7554/eLife.49562
    journal_url: https://elifesciences.org/articles/49562
    preprint_url: https://doi.org/10.1101/633107
    drive_id: 1TP3fmvC1x-TIUO5IVtO4bFlibN2UAFWY
    abstract: >
      Massed synchronised neuronal firing is detrimental to information processing. When networks of task-irrelevant neurons fire in unison, they mask the signal generated by task-critical neurons. On a macroscopic level, such synchronisation can contribute to alpha/beta (8–30 Hz) oscillations. Reducing the amplitude of these oscillations, therefore, may enhance information processing. Here, we test this hypothesis. Twenty-one participants completed an associative memory task while undergoing simultaneous EEG-fMRI recordings. Using representational similarity analysis, we quantified the amount of stimulus-specific information represented within the BOLD signal on every trial. When correlating this metric with concurrently-recorded alpha/beta power, we found a significant negative correlation which indicated that as post-stimulus alpha/beta power decreased, stimulus-specific information increased. Critically, we found this effect in three unique tasks: visual perception, auditory perception, and visual memory retrieval, indicating that this phenomenon transcends both stimulus modality and cognitive task. These results indicate that alpha/beta power decreases parametrically track the fidelity of both externally-presented and internally-generated stimulus-specific information represented within the cortex.

  - slug: griffiths-2019-directional-coupling
    title: Directional coupling of slow and fast hippocampal gamma with neocortical alpha/beta oscillations in human episodic memory
    authors: ["Griffiths, Benjamin J.", "Parish, George", "Roux, Frederic", "Michelmann, Sebastian", "van der Plas, Mircea", "Kolibius, Luca D.", "Chelvarajah, Ramesh", "Rollings, David T.", "Sawlani, Vijay", "Hamer, Hajo", "Gollwitzer, Stephanie", "Kreiselmeyer, Gernot", "Staresina, Bernhard", "Wimber, Maria", "Hanslmayr, Simon"]
    journal: Proceedings of the National Academy of Sciences
    volume: "116"
    issue: "43"
    first_page: "21834"
    last_page: "21842"
    date: 2019-10-09
    doi: 10.1073/pnas.1914180116
    journal_url: https://www.pnas.org/doi/10.1073/pnas.1914180116
    drive_id: 1Md7EXeSfyndg0KHTAw3_tYYIB09iIsXF
    abstract: >
      Episodic memories hinge upon our ability to process a wide range of multisensory information and bind this information into a coherent, memorable representation. On a neural level, these 2 processes are thought to be supported by neocortical alpha/beta desynchronization and hippocampal theta/gamma synchronization, respectively. Intuitively, these 2 processes should couple to successfully create and retrieve episodic memories, yet this hypothesis has not been tested empirically. We address this by analyzing human intracranial electroencephalogram data recorded during 2 associative memory tasks. We find that neocortical alpha/beta (8 to 20 Hz) power decreases reliably precede and predict hippocampal “fast” gamma (60 to 80 Hz) power increases during episodic memory formation; during episodic memory retrieval, however, hippocampal “slow” gamma (40 to 50 Hz) power increases reliably precede and predict later neocortical alpha/beta power decreases. We speculate that this coupling reflects the flow of information from the neocortex to the hippocampus during memory formation, and hippocampal pattern completion inducing information reinstatement in the neocortex during memory retrieval.

  - slug: griffiths-2017-reward-punishment
    title: Opposing effects of reward and punishment on human vigor
    authors: ["Griffiths, Benjamin", "Beierholm, Ulrik R."]
    journal: Scientific Reports
    volume: "7"
    article_number: "42287"
    date: 2017-02-13
    doi: 10.1038/srep42287
    journal_url: https://www.nature.com/articles/srep42287
    drive_id: 1hHRo24j04OOi_xl5yH7MyR9Be3v6gJh_
    abstract: >
      The vigor with which humans and animals engage in a task is often a determinant of the likelihood of the task’s success. An influential theoretical model suggests that the speed and rate at which responses are made should depend on the availability of rewards and punishments. While vigor facilitates the gathering of rewards in a bountiful environment, there is an incentive to slow down when punishments are forthcoming so as to decrease the rate of punishments, in conflict with the urge to perform fast to escape punishment. Previous experiments confirmed the former, leaving the latter unanswered. We tested the influence of punishment in an experiment involving economic incentives and contrasted this with reward related behavior on the same task. We found that behavior corresponded with the theoretical model; while instantaneous threat of punishment caused subjects to increase the vigor of their response, subjects’ response times would slow as the overall rate of punishment increased. We quantitatively show that this is in direct contrast to increases in vigor in the face of increased overall reward rates. These results highlight the opposed effects of rewards and punishments and provide further evidence for their roles in the variety of types of human decisions.

  - slug: griffiths-2016-real-world
    title: Brain oscillations track the formation of episodic memories in the real world
    authors: ["Griffiths, Benjamin", "Mazaheri, Ali", "Debener, Stefan", "Hanslmayr, Simon"]
    journal: NeuroImage
    volume: "143"
    first_page: "256"
    last_page: "266"
    date: 2016-12
    doi: 10.1016/j.neuroimage.2016.09.021
    journal_url: https://www.sciencedirect.com/science/article/abs/pii/S1053811916304840
    preprint_url: https://doi.org/10.1101/042929
    abstract: >
      Despite the well-known influence of environmental context on episodic memory, little has been done to increase contextual richness within the lab. This leaves a blind spot lingering over the neuronal correlates of episodic memory formation in day-to-day life. To address this, we presented participants with a series of words to memorise along a pre-designated route across campus while a mobile EEG system acquired ongoing neural activity. Replicating lab-based subsequent memory effects (SMEs), we identified significant low to mid frequency power decreases (<30 Hz), including beta power decreases over the left inferior frontal gyrus. When investigating the oscillatory correlates of temporal and spatial context binding, we found that items strongly bound to spatial context exhibited significantly greater theta power decreases than items strongly bound to temporal context. These findings expand upon lab-based studies by demonstrating the influence of real world contextual factors that underpin memory formation.

